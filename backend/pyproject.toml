[project]
name = "navimed-backend"
version = "0.1.0"
description = "NaviMed healthcare coordination backend"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.128,<1.0",
  "uvicorn[standard]>=0.35,<1.0",
  "sqlalchemy>=2.0,<3.0",
  "psycopg[binary]>=3.2,<4.0",
  "alembic>=1.18,<2.0",
  "pydantic-settings>=2.10,<3.0",
  "PyJWT[crypto]>=2.10,<3.0",
  "httpx>=0.28,<1.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=9.0,<10.0",
  "pytest-asyncio>=1.0,<2.0",
  "ruff>=0.14,<1.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
