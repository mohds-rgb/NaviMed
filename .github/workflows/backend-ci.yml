name: backend-ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install
        working-directory: backend
        run: pip install -e ".[dev]"
      - name: Compile
        run: python -m compileall backend/app backend/scripts
      - name: Test
        working-directory: backend
        run: python -m pytest
      - name: Ruff
        working-directory: backend
        run: ruff check app tests
