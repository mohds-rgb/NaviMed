services:
  postgres:
    image: postgres:18-alpine
    container_name: navimed-postgres
    environment:
      POSTGRES_DB: navimed
      POSTGRES_USER: navimed
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the local .env file}
    ports:
      - "5432:5432"
    volumes:
      - navimed_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U navimed -d navimed"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./backend
    environment:
      NAVIMED_DATABASE_URL: ${NAVIMED_DATABASE_URL:?Set NAVIMED_DATABASE_URL in the local .env file}
      NAVIMED_ENV: development
      NAVIMED_MESSAGING_ENABLED: "false"
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  navimed_pgdata:
